version: '3.8'

services:
  backend:
    build:
      context: ./burncup-be
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - postgres

  frontend:
    build:
      context: ./burncup-fe
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production


  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: burncup_prod
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com # Change this to your preferred login
      PGADMIN_DEFAULT_PASSWORD: admin        # Change this to your preferred password
    ports:
      - "5050:80"
    depends_on:
      - postgres
      
volumes:
  pgdata: